<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="170" viewBox="0 0 1280 170" role="img" aria-labelledby="title desc">
  <title id="title">Métricas de Samuel Cagnani</title>
  <desc id="desc">Três títulos em hackathons, mais de 40 pessoas lideradas, quatro projetos de P&amp;D e mais de 180 alunos acompanhados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1626"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1280" height="170" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="170" rx="14" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(40 24)">
      <rect width="280" height="122" rx="10" fill="#0b1626" stroke="#1e3a5f"/>
      <text x="24" y="62" fill="#22d3ee" font-size="42" font-weight="700">3x</text>
      <text x="24" y="94" fill="#94a3b8" font-size="13" letter-spacing="1.5">CAMPEÃO EM HACKATHONS</text>
    </g>
    <g transform="translate(340 24)">
      <rect width="280" height="122" rx="10" fill="#0b1626" stroke="#1e3a5f"/>
      <text x="24" y="62" fill="#34d399" font-size="42" font-weight="700">+40</text>
      <text x="24" y="94" fill="#94a3b8" font-size="13" letter-spacing="1.5">PESSOAS LIDERADAS</text>
    </g>
    <g transform="translate(640 24)">
      <rect width="280" height="122" rx="10" fill="#0b1626" stroke="#1e3a5f"/>
      <text x="24" y="62" fill="#a5b4fc" font-size="42" font-weight="700">4</text>
      <text x="24" y="94" fill="#94a3b8" font-size="13" letter-spacing="1.5">PROJETOS DE P&amp;D</text>
    </g>
    <g transform="translate(940 24)">
      <rect width="280" height="122" rx="10" fill="#0b1626" stroke="#1e3a5f"/>
      <text x="24" y="62" fill="#67e8f9" font-size="42" font-weight="700">+180</text>
      <text x="24" y="94" fill="#94a3b8" font-size="13" letter-spacing="1.5">ALUNOS ACOMPANHADOS</text>
    </g>
  </g>
</svg>
